name: Import GSoC 2026 Work

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mARine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create integration branch
        run: |
          git checkout -b gsoc-2026-import

      - name: Fetch Marine Biology AR Application
        run: |
          git remote add source https://github.com/AIOTSonline/Marine_Biology_AR_Application.git
          git fetch source main

      - name: Merge consolidated application history
        run: |
          git merge source/main --allow-unrelated-histories --no-edit

      - name: Push integration branch
        run: |
          git push origin gsoc-2026-import
