name: Import Marine Biology AR into mARine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mARine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Clone Marine Biology AR
        run: |
          git clone --depth 1 --branch main \
            https://github.com/AIOTSonline/Marine_Biology_AR_Application.git \
            /tmp/source

      - name: Replace repository contents with source
        run: |
          # Remove everything from mARine except its .git directory
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          # Copy the complete source repository contents
          rsync -a --exclude='.git/' /tmp/source/ ./

      - name: Commit imported content
        run: |
          git config user.name "AIOTSonline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "feat: import consolidated Marine Biology AR application"

      - name: Push to mARine main
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/AIOTSonline/mARine.git
          git push --force-with-lease origin HEAD:main
