name: Replace mARine Main with Marine Biology AR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Marine Biology AR main
        run: |
          git remote add source https://github.com/AIOTSonline/Marine_Biology_AR_Application.git
          git fetch source main

      - name: Replace mARine main
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/AIOTSonline/mARine.git
          git push --force origin source/main:main
