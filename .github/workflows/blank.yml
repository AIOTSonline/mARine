name: Replace mARine Main with Marine Biology AR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Marine Biology AR main
        run: |
          git remote add source https://github.com/AIOTSonline/Marine_Biology_AR_Application.git
          git fetch source main

      - name: Replace mARine main
        run: |
          git push --force origin source/main:main
